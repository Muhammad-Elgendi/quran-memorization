apiVersion: v1
kind: Namespace
metadata:
  name: quran-memorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: quran-memorization
data:
  APP_NAME: "Quran Memorization Assistant"
  HOST: "0.0.0.0"
  PORT: "8000"
  QURAN_PATH: "data/quran.json"
  DEFAULT_THRESHOLD: "0.85"
  WORD_MATCH_THRESHOLD: "0.75"
  MIN_AUDIO_SECONDS: "0.5"
  MAX_AUDIO_SECONDS: "20.0"
  MOONSHINE_MODEL: "UsefulSensors/moonshine-tiny-ar"
  CORS_ORIGINS: "*"
  PREFETCH_MODEL: "1"
  HF_HOME: "/models/huggingface"
  TRANSFORMERS_CACHE: "/models/huggingface"
  # Phase 2 stream (CPU-light defaults)
  STREAM_PARTIALS_DEFAULT: "false"
  STREAM_PARTIAL_EVERY_MS: "2000"
  STREAM_SILENCE_MS: "800"
  STREAM_IDLE_TIMEOUT_S: "60"
  STREAM_MAX_SESSION_S: "1800"
  STREAM_MAX_CONCURRENT_SESSIONS: "2"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-model-cache
  namespace: quran-memorization
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quran-data
  namespace: quran-memorization
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: quran-memorization
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: quran-memorization-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
          volumeMounts:
            - name: quran-data
              mountPath: /app/backend/data
            - name: hf-cache
              mountPath: /models/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
      volumes:
        - name: quran-data
          persistentVolumeClaim:
            claimName: quran-data
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: quran-memorization
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: quran-memorization
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: quran-memorization-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: quran-memorization
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quran-memorization
  namespace: quran-memorization
  annotations:
    # Adjust for your ingress controller (nginx example).
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket upgrade for /api/memorization/stream (via frontend nginx → backend).
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
spec:
  ingressClassName: nginx
  rules:
    - host: quran.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
