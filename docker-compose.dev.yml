services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quran-memorization-backend:local
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "*"
      PREFETCH_MODEL: "0"
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    volumes:
      # Bind-mount source for hot reload; corpus downloads into ./backend/data
      - ./backend:/app/backend
      - hf_cache:/models/huggingface
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache:
  frontend_node_modules:
