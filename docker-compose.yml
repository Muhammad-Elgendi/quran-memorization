services:
  model-prefetch:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quran-memorization-backend:local
    environment:
      STT_MODEL: "tarteel-ai/whisper-tiny-ar-quran"
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
    volumes:
      - hf_cache:/models/huggingface
    entrypoint: ["python", "/app/backend/prefetch_model.py"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quran-memorization-backend:local
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      QURAN_PATH: "data/quran.json"
      DEFAULT_THRESHOLD: "0.85"
      WORD_MATCH_THRESHOLD: "0.75"
      MIN_AUDIO_SECONDS: "0.5"
      MAX_AUDIO_SECONDS: "20.0"
      STT_MODEL: "tarteel-ai/whisper-tiny-ar-quran"
      CORS_ORIGINS: "*"
      STREAM_MAX_CONCURRENT_SESSIONS: "8"
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
    volumes:
      - quran_data:/app/backend/data
      - hf_cache:/models/huggingface
    depends_on:
      model-prefetch:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty base URL → browser calls same origin; nginx proxies /api.
        VITE_API_BASE_URL: ""
        VITE_AUDIO_DENOISE: "off"
    image: quran-memorization-frontend:local
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quran_data:
  hf_cache:
