services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quran-memorization-backend:local
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      QURAN_PATH: "data/quran.json"
      DEFAULT_THRESHOLD: "0.85"
      WORD_MATCH_THRESHOLD: "0.75"
      MIN_AUDIO_SECONDS: "0.5"
      MAX_AUDIO_SECONDS: "20.0"
      MOONSHINE_MODEL: "UsefulSensors/moonshine-tiny-ar"
      CORS_ORIGINS: "*"
      PREFETCH_MODEL: "${PREFETCH_MODEL:-0}"
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    volumes:
      - quran_data:/app/backend/data
      - hf_cache:/models/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty base URL → browser calls same origin; nginx proxies /api.
        VITE_API_BASE_URL: ""
    image: quran-memorization-frontend:local
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quran_data:
  hf_cache:
